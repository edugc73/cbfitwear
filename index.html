<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camilla Bilha | Fitwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-main: #1a2a3a;
            --brand-accent: #d4a373;
            --brand-light: #f4f4f9;
            --header-bg: rgba(243, 229, 232, 0.4); 
            --white: #ffffff;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --overlay: rgba(0,0,0,0.7);
        }

        /* Aplicando a fonte Inter como principal */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        
        body { 
            background-color: var(--brand-light); 
            color: var(--brand-main); 
            line-height: 1.6; 
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('logo3.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.05; /* Reduzido para maior elegância */
            z-index: -1;
            pointer-events: none;
        }

        header { 
            background-color: var(--header-bg); 
            padding: 20px; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,0,0,0.02);
        }
        .logo { max-width: 150px; border-radius: 12px; background: white; padding: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h2 { text-align: center; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; position: relative; }
        .product-card img { width: 100%; height: 400px; object-fit: cover; display: block; }
        .product-info { padding: 15px; text-align: center; font-weight: 600; }

        /* --- ESTILOS DA NOVA GALERIA NO MODAL --- */
        .modal-gallery {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            margin-bottom: 20px;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }
        .modal-gallery img {
            width: 100%;
            max-height: 400px; /* Limita a altura para caber na tela */
            /* --- CORREÇÃO AQUI: Mudado de cover para contain --- */
            object-fit: contain; /* Garante que a foto apareça inteira */
            background: rgba(255,255,255,0.05); /* Adiciona um fundo leve se a foto não preencher tudo */
            /* ----------------------------------------------- */
            border-radius: 12px;
            scroll-snap-align: center;
            flex-shrink: 0;
        }
        .modal-gallery::-webkit-scrollbar { height: 6px; }
        .modal-gallery::-webkit-scrollbar-thumb { background: var(--brand-accent); border-radius: 10px; }

        /* MODAL */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: var(--overlay); align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--brand-main); color: white; padding: 30px; border-radius: 20px;
            width: 95%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto;
        }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 25px; cursor: pointer; color: var(--brand-accent); z-index: 10; }

        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.75rem; color: #cbd5e1; font-weight: 700; margin-bottom: 0.5rem; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; background: #26394e; border: 1px solid #3e5671; border-radius: 8px; color: white; font-size: 1rem; outline: none; }

        #aviso-estoque { display: none; color: var(--warning); font-weight: 700; font-size: 0.85rem; text-align: center; margin-bottom: 15px; }

        .cart-section { background: var(--brand-main); color: white; padding: 30px; border-radius: 20px; max-width: 700px; margin: 0 auto 50px auto; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .remove-btn { color: var(--danger); cursor: pointer; background: none; border: none; font-size: 1.1rem; }

        .btn-action { background: var(--brand-accent); color: var(--brand-main); border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .btn-finalize { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 20px; text-transform: uppercase; }

        #success-area { display: none; text-align: center; padding: 20px; }

        .whatsapp-float { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: #25d366; 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            text-decoration: none;
        }
        .whatsapp-float:hover { transform: scale(1.1); }

        @media (max-width: 600px) { .gallery { grid-template-columns: 1fr 1fr; gap: 10px; } .product-card img { height: 220px; } }
    </style>
</head>
