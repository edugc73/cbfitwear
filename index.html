<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camilla Bilha | Fitwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-main: #1a2a3a;
            --brand-accent: #d4a373;
            --brand-light: #f4f4f9;
            --white: #ffffff;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--brand-light); color: var(--brand-main); line-height: 1.6; }

        header {
            background-color: var(--brand-main);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .logo { 
            max-width: 150px; 
            height: auto; 
            border-radius: 15px;
            border: 2px solid var(--brand-accent);
            background: white;
            padding: 5px;
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h2 { text-align: center; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }

        /* GALERIA MELHORADA */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        
        .product-card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            cursor: pointer; 
            position: relative;
        }

        .product-card:hover img { transform: scale(1.05); }
        .product-card img { width: 100%; height: 400px; object-fit: cover; display: block; transition: transform 0.5s; }
        
        .product-card .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 42, 58, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            color: white;
            font-weight: 700;
        }
        .product-card:hover .overlay { opacity: 1; }

        .product-info { padding: 15px; text-align: center; font-weight: 600; background: white; }

        /* SEÇÃO CARRINHO */
        .cart-section {
            background: var(--brand-main);
            color: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 700px;
            margin: 0 auto 50px auto;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .cart-section h3 { text-align: center; margin-bottom: 25px; color: var(--brand-accent); }
        
        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.75rem; color: #cbd5e1; font-weight: 700; margin-bottom: 0.5rem; text-transform: uppercase; }
        
        select, input {
            width: 100%; padding: 12px; background: #26394e; border: 1px solid #3e5671; 
            border-radius: 8px; color: white; font-size: 1rem;
        }

        #estoque-msg { display: none; color: var(--danger); font-weight: 700; text-align: center; margin-bottom: 10px; }

        .btn-add { background: var(--brand-accent); color: var(--brand-main); border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; }
        .btn-add:disabled { background: #555; cursor: not-allowed; }

        .cart-items { margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .remove-btn { color: var(--danger); cursor: pointer; background: none; border: none; }

        .btn-finalize { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 20px; }

        #success-area { display: none; text-align: center; padding: 30px; background: rgba(16, 185, 129, 0.1); border-radius: 15px; border: 2px solid var(--success); }

        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background: #25d366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1000; text-decoration: none; font-size: 30px; }

        @media (max-width: 600px) {
            .gallery { grid-template-columns: 1fr 1fr; gap: 10px; }
            .product-card img { height: 220px; }
        }
    </style>
</head>
<body>

<header>
    <img src="LOGO1.jpeg" alt="Camilla Bilha Logo" class="logo">
</header>

<div class="container">
    <h2>Coleção Exclusive</h2>
    <p style="text-align: center; margin-bottom: 30px; font-size: 0.9rem; opacity: 0.7;">Clique na foto para adicionar ao carrinho</p>
    <div class="gallery" id="vitrine"></div>

    <div class="cart-section" id="carrinho-area">
        <div id="form-container">
            <h3>Seu Carrinho</h3>
            
            <div id="lista-carrinho" class="cart-items">
                <p style="text-align: center; opacity: 0.5; padding: 20px;">O carrinho está vazio.</p>
            </div>

            <div style="text-align: right; font-weight: 700; font-size: 1.2rem; margin-bottom: 20px;">
                Total: <span id="total-carrinho" style="color: var(--brand-accent);">R$ 0,00</span>
            </div>

            <div class="input-group">
                <label>Seu Nome</label>
                <input type="text" id="nome_cliente" placeholder="Digite seu nome completo">
            </div>

            <button class="btn-finalize" onclick="enviarPedido()">FINALIZAR COMPRA</button>
        </div>

        <div id="success-area">
            <h2 style="color: var(--success); margin-bottom: 10px;">Obrigada pela compra!</h2>
            <p style="margin-bottom: 20px;">Entraremos em contato em breve.</p>
            <div style="background: white; padding: 10px; display: inline-block; border-radius: 10px; margin-bottom: 15px;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=bilhacamilla86@gmail.com" alt="QR Code">
            </div>
            <p style="font-size: 0.8rem; margin-bottom: 10px;">Chave PIX: bilhacamilla86@gmail.com</p>
            <button onclick="copiarPix()" id="btn-pix" style="background: var(--brand-accent); border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: 700;">COPIAR CHAVE PIX</button>
        </div>
    </div>
</div>

<a href="https://wa.me/5513996526566" class="whatsapp-float" target="_blank">🟢</a>

<script>
const SHEET_ID = '10PHxjW6F-roUMump4IkhLF4UG0kB_yvX'; 
const SHEET_NAME = 'cbfitwear'; 
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

let dados = [];
let carrinho = [];

const fotosVitrine = [
    {n: 'CONJUNTO MARROM', f: 'foto1.jpeg'}, {n: 'CONJUNTO VERDE OLIVA', f: 'foto2.jpeg'},
    {n: 'CONJUNTO AZUL MARINHO', f: 'foto3.jpeg'}, {n: 'CONJUNTO PINK', f: 'foto5.jpeg'},
    {n: 'CONJUNTO VINHO', f: 'foto6.jpeg'}, {n: 'CONJUNTO VERDE CLARO', f: 'foto7.jpeg'},
    {n: 'CONJUNTO ROSA NEON', f: 'foto8.jpeg'}, {n: 'MACACÃO MARROM', f: 'foto9.jpeg'},
    {n: 'ROUPAS CBFITEAR', f: 'foto10.png'}
];

async function carregarDados() {
    try {
        const response = await fetch(URL);
        const text = await response.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        dados = json.table.rows.map(row => ({
            p: row.c[0]?.v || '', t: row.c[1]?.v || '', 
            c: row.c[2]?.v || '', v: row.c[3]?.v || 0, e: row.c[4]?.v || 0
        }));
        renderVitrine();
    } catch (e) { console.error("Erro ao carregar dados:", e); }
}

function renderVitrine() {
    const vitrine = document.getElementById('vitrine');
    vitrine.innerHTML = fotosVitrine.map(item => {
        // Verifica se existe alguma variação desse produto com estoque > 0
        const temNoEstoque = dados.some(d => d.p === item.n && d.e > 0);
        
        return `
            <div class="product-card" onclick="cliqueNaFoto('${item.n}', ${temNoEstoque})">
                <img src="${item.f}" alt="${item.n}" style="${!temNoEstoque ? 'filter: grayscale(1); opacity: 0.6;' : ''}">
                <div class="overlay">${temNoEstoque ? '+ ADICIONAR' : 'ESGOTADO'}</div>
                <div class="product-info">
                    ${item.n}<br>
                    <small style="color: ${temNoEstoque ? 'var(--success)' : 'var(--danger)'}">
                        ${temNoEstoque ? 'Disponível' : 'Sem estoque'}
                    </small>
                </div>
            </div>
        `;
    }).join('');
}

function cliqueNaFoto(nomeProduto, temNoEstoque) {
    if (!temNoEstoque) {
        alert("Desculpe, este modelo está sem peça no estoque no momento.");
        return;
    }

    // Busca a primeira variação disponível deste produto
    const itemDisponivel = dados.find(d => d.p === nomeProduto && d.e > 0);
    
    if (itemDisponivel) {
        carrinho.push({...itemDisponivel, id: Date.now()});
        atualizarCarrinho();
        // Feedback visual de que foi adicionado
        const carrinhoArea = document.getElementById('carrinho-area');
        carrinhoArea.scrollIntoView({ behavior: 'smooth' });
    }
}

function atualizarCarrinho() {
    const lista = document.getElementById('lista-carrinho');
    if (carrinho.length === 0) {
        lista.innerHTML = '<p style="text-align: center; opacity: 0.5; padding: 20px;">O carrinho está vazio.</p>';
        document.getElementById('total-carrinho').textContent = "R$ 0,00";
        return;
    }

    lista.innerHTML = carrinho.map(i => `
        <div class="cart-item">
            <div>
                <strong>${i.p}</strong><br>
                <small>${i.t} | ${i.c}</small>
            </div>
            <span>R$ ${i.v.toFixed(2).replace('.',',')} <button class="remove-btn" onclick="remover(${i.id})">✕</button></span>
        </div>
    `).join('');
    
    const total = carrinho.reduce((acc, i) => acc + i.v, 0);
    document.getElementById('total-carrinho').textContent = `R$ ${total.toFixed(2).replace('.',',')}`;
}

function remover(id) {
    carrinho = carrinho.filter(i => i.id !== id);
    atualizarCarrinho();
}

function enviarPedido() {
    const nome = document.getElementById('nome_cliente').value;
    if(!nome || carrinho.length === 0) return alert("Por favor, preencha seu nome e adicione itens ao carrinho!");

    const total = carrinho.reduce((acc, i) => acc + i.v, 0);
    const lista = carrinho.map(i => `- ${i.p} [${i.t} | ${i.c}]: R$ ${i.v.toFixed(2)}`).join('\n');
    
    const corpo = `Olá Camilla, pedido de ${nome}:\n\n${lista}\n\nTOTAL: R$ ${total.toFixed(2)}\n\nChave PIX: bilhacamilla86@gmail.com`;
    window.location.href = `mailto:camilla.bilha@hotmail.com?subject=Novo Pedido - ${nome}&body=${encodeURIComponent(corpo)}`;

    document.getElementById('form-container').style.display = 'none';
    document.getElementById('success-area').style.display = 'block';
}

function copiarPix() {
    const input = document.getElementById("pix-chave");
    navigator.clipboard.writeText(input.value);
    document.getElementById("btn-pix").textContent = "CHAVE COPIADA!";
    setTimeout(() => { document.getElementById("btn-pix").textContent = "COPIAR CHAVE PIX"; }, 2000);
}

window.onload = carregarDados;
</script>
</body>
</html>
