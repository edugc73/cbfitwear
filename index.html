<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camilla Bilha | Fitwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-main: #1a2a3a;
            --brand-accent: #d4a373;
            --brand-light: #f4f4f9;
            --header-bg: rgba(243, 229, 232, 0.4); 
            --white: #ffffff;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --overlay: rgba(0,0,0,0.7);
        }

        /* Aplicando a fonte Inter como principal */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        
        body { 
            background-color: var(--brand-light); 
            color: var(--brand-main); 
            line-height: 1.6; 
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('logo3.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.05;
            z-index: -1;
            pointer-events: none;
        }

        header { 
            background-color: var(--header-bg); 
            padding: 20px; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,0,0,0.02);
        }
        .logo { max-width: 150px; border-radius: 12px; background: white; padding: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h2 { text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }

        /* --- FILTROS DE CATEGORIA --- */
        .category-filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: white;
            border: 1px solid var(--brand-accent);
            color: var(--brand-main);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .filter-btn.active {
            background: var(--brand-accent);
            color: var(--brand-main);
        }
        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; position: relative; }
        .product-card img { width: 100%; height: 400px; object-fit: cover; display: block; }
        .product-info { padding: 15px; text-align: center; font-weight: 600; }

        /* --- ESTILOS DO MODAL --- */
        .modal-gallery { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 20px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
        .modal-gallery img { width: 100%; max-height: 400px; object-fit: contain; background: rgba(255,255,255,0.05); border-radius: 12px; scroll-snap-align: center; flex-shrink: 0; }
        .modal-gallery::-webkit-scrollbar { height: 6px; }
        .modal-gallery::-webkit-scrollbar-thumb { background: var(--brand-accent); border-radius: 10px; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: var(--overlay); align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--brand-main); color: white; padding: 30px; border-radius: 20px; width: 95%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 25px; cursor: pointer; color: var(--brand-accent); z-index: 10; }

        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.75rem; color: #cbd5e1; font-weight: 700; margin-bottom: 0.5rem; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; background: #26394e; border: 1px solid #3e5671; border-radius: 8px; color: white; font-size: 1rem; outline: none; }

        .cart-section { background: var(--brand-main); color: white; padding: 30px; border-radius: 20px; max-width: 700px; margin: 0 auto 50px auto; }
        .btn-action { background: var(--brand-accent); color: var(--brand-main); border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .btn-finalize { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 20px; text-transform: uppercase; }

        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background: #25d366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1000; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); }

        @media (max-width: 600px) { .gallery { grid-template-columns: 1fr 1fr; gap: 10px; } .product-card img { height: 220px; } }
    </style>
</head>
<body>

<header>
    <img src="LOGO1.jpeg" alt="Logo Camilla Bilha" class="logo">
</header>

<div class="container">
    <h2>Coleção Exclusive</h2>
    
    <div class="category-filters">
        <button class="filter-btn active" onclick="filtrarCategoria('tudo', this)">Tudo</button>
        <button class="filter-btn" onclick="filtrarCategoria('conjunto', this)">Conjuntos</button>
        <button class="filter-btn" onclick="filtrarCategoria('macacao', this)">Macacões</button>
        <button class="filter-btn" onclick="filtrarCategoria('camiseta', this)">Camisetas</button>
    </div>

    <div class="gallery" id="vitrine"></div>

    <div class="cart-section">
        <div id="form-container">
            <h3>Seu Carrinho</h3>
            <div id="lista-carrinho" style="margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1);">
                <p style="text-align: center; opacity: 0.5; padding: 20px;">O carrinho está vazio.</p>
            </div>
            <div style="text-align: right; font-weight: 700; font-size: 1.2rem; margin-bottom: 20px;">
                Total: <span id="total-carrinho" style="color: var(--brand-accent);">R$ 0,00</span>
            </div>
            <div class="input-group">
                <label>Seu Nome</label>
                <input type="text" id="nome_cliente" placeholder="Nome Completo">
            </div>
            <button class="btn-finalize" onclick="enviarPedido()">FINALIZAR COMPRA</button>
        </div>
        </div>
</div>

<script>
const SHEET_ID = '10PHxjW6F-roUMump4IkhLF4UG0kB_yvX'; 
const SHEET_NAME = 'cbfitwear'; 
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

let dados = [];
let carrinho = [];
let categoriaAtual = 'tudo';

// LISTA ATUALIZADA COM O CAMPO 'cat' PARA FILTRAGEM
const fotosVitrine = [
    {n: 'Conjunto Basic(Top alcina e Bermuda)', f: ['foto5.jpeg', 'foto5_v2.jpeg'], cat: 'conjunto'}, 
    {n: 'Conjunto Bolso(Top alcina e Bermuda c/bolso)', f: ['foto2.jpeg'], cat: 'conjunto'},
    {n: 'Macacão Bicolor Poliamida', f: ['foto6.jpeg', 'foto11.jpeg', 'foto4.jpeg'], cat: 'macacao'}, 
    {n: 'Macacao Basic Poliamida', f: ['foto7.jpeg'], cat: 'macacao'},
    {n: 'Conjunto Basic Calça(Top alcina e Calça)', f: ['foto9.jpeg'], cat: 'conjunto'}, 
    {n: 'Conjunto Bicolor Poliamida', f: ['foto15.jpeg'], cat: 'conjunto'}, 
    {n: 'Conjunto Basic(Top nadador e Bermuda)', f: ['foto16.jpeg'], cat: 'conjunto'}, 
    {n: 'Conjunto Bolso(Top nadador e Bermuda com bolso)', f: ['foto20.jpeg'], cat: 'conjunto'},
    {n: 'Conjunto Short Poliamida Importado', f: ['foto21.jpeg'], cat: 'conjunto'},
    {n: 'Camiseta dry fit', f: ['foto3.png'], cat: 'camiseta'}
];

async function carregarDados() {
    try {
        const response = await fetch(URL);
        const text = await response.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        dados = json.table.rows.map(row => ({
            p: row.c[0]?.v || '', t: row.c[1]?.v || '', 
            c: row.c[2]?.v || '', v: row.c[3]?.v || 0, e: row.c[4]?.v || 0
        }));
        renderVitrine();
    } catch (e) { console.error("Erro dados:", e); }
}

// FUNÇÃO DE FILTRAGEM
function filtrarCategoria(cat, btn) {
    categoriaAtual = cat;
    
    // Atualiza botões
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    renderVitrine();
}

function renderVitrine() {
    const vitrine = document.getElementById('vitrine');
    
    // Filtra os itens da vitrine baseado na categoria selecionada
    const itensFiltrados = categoriaAtual === 'tudo' 
        ? fotosVitrine 
        : fotosVitrine.filter(item => item.cat === categoriaAtual);

    vitrine.innerHTML = itensFiltrados.map(item => {
        const estoque = dados.filter(d => d.p === item.n).reduce((acc, curr) => acc + curr.e, 0);
        return `
            <div class="product-card" onclick="abrirModal('${item.n}')">
                <img src="${item.f[0]}" style="${estoque <= 0 ? 'filter: grayscale(1); opacity: 0.5;' : ''}">
                <div class="product-info">${item.n}<br>
                <small style="color:${estoque > 0 ? 'var(--success)' : 'var(--danger)'}">${estoque > 0 ? (estoque === 1 ? 'Última Peça!' : 'Disponível') : 'Esgotado'}</small>
                </div>
            </div>
        `;
    }).join('');
}

// Funções de Modal, Carrinho e WhatsApp mantidas conforme index3.0.html
window.onload = carregarDados;
</script>
</body>
</html>
