<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camilla Bilha | Fitwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 1. Ajuste da cor de fundo para combinar com o logo (Azul Escuro Profundo) */
            --dark-blue: #071121; 
            --accent-pink: #d4a373;
            --white: #ffffff;
            --bg-body: #f8f9fa;
            --accent-green: #10b981;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; transition: all 0.3s ease; }
        body { background-color: var(--bg-body); color: var(--dark-blue); line-height: 1.6; }

        header {
            background-color: var(--dark-blue);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* 2. Melhoria no Logo (Menos quadrado) */
        .logo { 
            max-width: 140px; 
            height: auto; 
            border-radius: 50%; /* Torna o logo circular se for 1:1 ou arredonda as bordas */
            border: 2px solid var(--accent-pink);
            padding: 5px;
            background: white;
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h2 { text-align: center; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid #eee; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 12px 20px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 400px; object-fit: cover; display: block; }
        .product-info { padding: 15px; text-align: center; font-weight: 600; font-size: 0.9rem; }

        /* 3. Seção do Carrinho */
        .cart-section {
            background: var(--dark-blue);
            color: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 800px;
            margin: 0 auto 50px auto;
        }

        .cart-section h3 { text-align: center; margin-bottom: 20px; color: var(--accent-pink); }
        
        .cart-items { margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .cart-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); 
        }
        .remove-btn { color: var(--danger); cursor: pointer; font-size: 0.8rem; border: none; background: none; }

        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.75rem; color: #94a3b8; font-weight: 700; margin-bottom: 0.5rem; text-transform: uppercase; }
        
        select, input {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; outline: none;
        }

        .btn-add { background: var(--accent-pink); color: var(--dark-blue); border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-finalize { background: var(--accent-green); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 20px; font-size: 1.1rem; }

        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background: #25d366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1000; text-decoration: none; font-size: 30px; }
        
        @media (max-width: 600px) {
            .gallery { grid-template-columns: 1fr 1fr; gap: 10px; }
            .product-card img { height: 220px; }
        }
    </style>
</head>
<body>

<header>
    <img src="LOGO1.jpeg" alt="Camilla Bilha Logo" class="logo">
</header>

<div class="container">
    <h2>Coleção Exclusive</h2>
    <div class="gallery" id="vitrine">
        </div>

    <div class="cart-section" id="fazer-pedido">
        <h3>Seu Carrinho</h3>
        
        <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; margin-bottom: 30px; border: 1px dashed rgba(255,255,255,0.2);">
            <div class="input-group">
                <label>Produto</label>
                <select id="prod"></select>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="input-group">
                    <label>Tamanho</label>
                    <select id="tam" disabled></select>
                </div>
                <div class="input-group">
                    <label>Cor</label>
                    <select id="cor" disabled></select>
                </div>
            </div>
            <button class="btn-add" onclick="adicionarAoCarrinho()">+ Adicionar ao Carrinho</button>
        </div>

        <div id="lista-carrinho" class="cart-items">
            </div>

        <div style="text-align: right; font-size: 1.2rem; margin-bottom: 20px;">
            Total: <span id="total-carrinho" style="color: var(--accent-green); font-weight: 700;">R$ 0,00</span>
        </div>

        <div class="input-group">
            <label>Seu Nome</label>
            <input type="text" id="nome_cliente" placeholder="Como podemos te chamar?">
        </div>

        <button class="btn-finalize" onclick="enviarPedido()">Finalizar e Enviar Pedido</button>
    </div>
</div>

<a href="https://wa.me/5513996526566" class="whatsapp-float" target="_blank">🟢</a>

<script>
const SHEET_ID = '10PHxjW6F-roUMump4IkhLF4UG0kB_yvX'; 
const SHEET_NAME = 'cbfitwear'; 
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

let dados = [];
let carrinho = [];

// Lista de fotos para a vitrine (baseado no seu HTML original)
const fotosVitrine = [
    {n: 'CONJUNTO MARROM', f: 'foto1.jpeg'}, {n: 'CONJUNTO VERDE OLIVA', f: 'foto2.jpeg'},
    {n: 'CONJUNTO AZUL MARINHO', f: 'foto3.jpeg'}, {n: 'CONJUNTO PINK', f: 'foto5.jpeg'},
    {n: 'CONJUNTO VINHO', f: 'foto6.jpeg'}, {n: 'CONJUNTO VERDE CLARO', f: 'foto7.jpeg'},
    {n: 'CONJUNTO ROSA NEON', f: 'foto8.jpeg'}, {n: 'MACACÃO MARROM', f: 'foto9.jpeg'},
    {n: 'ROUPAS CBFITEAR', f: 'foto10.png'}
];

async function carregarDados() {
    try {
        const response = await fetch(URL);
        const text = await response.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        dados = json.table.rows.map(row => ({
            p: row.c[0]?.v || '', t: row.c[1]?.v || '', 
            c: row.c[2]?.v || '', v: row.c[3]?.v || 0, e: row.c[4]?.v || 0
        }));
        renderVitrine();
        initDropdown();
    } catch (e) { console.error("Erro ao carregar dados:", e); }
}

function renderVitrine() {
    const vitrineContainer = document.getElementById('vitrine');
    vitrineContainer.innerHTML = fotosVitrine.map(item => `
        <div class="product-card" onclick="selecionarDaVitrine('${item.n}')">
            <img src="${item.f}" alt="${item.n}">
            <div class="product-info">${item.n}</div>
        </div>
    `).join('');
}

function initDropdown() {
    const produtos = [...new Set(dados.map(i => i.p))].sort();
    const selProd = document.getElementById('prod');
    selProd.innerHTML = '<option value="" disabled selected>Selecione um produto...</option>';
    produtos.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        selProd.appendChild(opt);
    });
}

function selecionarDaVitrine(nomeProd) {
    const selProd = document.getElementById('prod');
    selProd.value = nomeProd;
    selProd.dispatchEvent(new Event('change'));
    document.getElementById('fazer-pedido').scrollIntoView({ behavior: 'smooth' });
}

// Lógica de cascata dos selects
document.getElementById('prod').addEventListener('change', (e) => {
    const filtrados = dados.filter(d => d.p === e.target.value);
    const tamanhos = [...new Set(filtrados.map(d => d.t))].sort();
    const selTam = document.getElementById('tam');
    selTam.innerHTML = '<option value="" disabled selected>Tamanho...</option>';
    tamanhos.forEach(t => { selTam.innerHTML += `<option value="${t}">${t}</option>`; });
    selTam.disabled = false;
});

document.getElementById('tam').addEventListener('change', (e) => {
    const filtrados = dados.filter(d => d.p === document.getElementById('prod').value && d.t === e.target.value);
    const cores = [...new Set(filtrados.map(d => d.c))].sort();
    const selCor = document.getElementById('cor');
    selCor.innerHTML = '<option value="" disabled selected>Cor...</option>';
    cores.forEach(c => { selCor.innerHTML += `<option value="${c}">${c}</option>`; });
    selCor.disabled = false;
});

function adicionarAoCarrinho() {
    const p = document.getElementById('prod').value;
    const t = document.getElementById('tam').value;
    const c = document.getElementById('cor').value;

    if(!p || !t || !c) return alert("Selecione Produto, Tamanho e Cor!");

    const item = dados.find(d => d.p === p && d.t === t && d.c === c);
    if(item) {
        carrinho.push({...item, id: Date.now()});
        atualizarCarrinho();
    }
}

function removerItem(id) {
    carrinho = carrinho.filter(i => i.id !== id);
    atualizarCarrinho();
}

function atualizarCarrinho() {
    const lista = document.getElementById('lista-carrinho');
    const totalElement = document.getElementById('total-carrinho');
    
    if(carrinho.length === 0) {
        lista.innerHTML = '<p style="text-align:center; padding: 20px; opacity: 0.5;">Carrinho vazio</p>';
        totalElement.textContent = "R$ 0,00";
        return;
    }

    lista.innerHTML = carrinho.map(item => `
        <div class="cart-item">
            <div>
                <strong>${item.p}</strong><br>
                <small>Tamanho: ${item.t} | Cor: ${item.c}</small>
            </div>
            <div style="text-align: right;">
                R$ ${item.v.toFixed(2).replace('.',',')}<br>
                <button class="remove-btn" onclick="removerItem(${item.id})">Remover</button>
            </div>
        </div>
    `).join('');

    const total = carrinho.reduce((acc, curr) => acc + curr.v, 0);
    totalElement.textContent = `R$ ${total.toFixed(2).replace('.',',')}`;
}

function enviarPedido() {
    const nome = document.getElementById('nome_cliente').value;
    if(!nome) return alert("Por favor, digite seu nome.");
    if(carrinho.length === 0) return alert("Seu carrinho está vazio!");

    let listaProdutos = carrinho.map(i => `- ${i.p} (${i.t}/${i.c}): R$ ${i.v.toFixed(2)}`).join('\n');
    const total = carrinho.reduce((acc, curr) => acc + curr.v, 0);

    const assunto = `Novo Pedido Fitwear - ${nome}`;
    const corpo = `Olá Camilla, gostaria de fazer o seguinte pedido:\n\n` +
                  `Cliente: ${nome}\n` +
                  `---------------------------\n` +
                  `${listaProdutos}\n` +
                  `---------------------------\n` +
                  `TOTAL: R$ ${total.toFixed(2).replace('.',',')}\n\n` +
                  `Aguardo as instruções para pagamento via PIX (bilhacamilla86@gmail.com).`;
    
    window.location.href = `mailto:camilla.bilha@hotmail.com?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
}

window.onload = carregarDados;
</script>
</body>
</html>
