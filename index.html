<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camilla Bilha | Fitwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-main: #1a2a3a;
            --brand-accent: #d4a373;
            --brand-light: #f4f4f9;
            --white: #ffffff;
            --success: #10b981;
            --danger: #ef4444;
            --overlay: rgba(0,0,0,0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--brand-light); color: var(--brand-main); line-height: 1.6; }

        header { background-color: var(--brand-main); padding: 20px; text-align: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .logo { max-width: 150px; border-radius: 15px; border: 2px solid var(--brand-accent); background: white; padding: 5px; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h2 { text-align: center; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }

        /* GALERIA */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; position: relative; }
        .product-card img { width: 100%; height: 400px; object-fit: cover; display: block; }
        .product-info { padding: 15px; text-align: center; font-weight: 600; }

        /* MODAL DE SELEÇÃO (POP-UP) */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: var(--overlay); align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--brand-main); color: white; padding: 30px; border-radius: 20px;
            width: 90%; max-width: 450px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 25px; cursor: pointer; color: var(--brand-accent); }

        /* CAMPOS DO MODAL */
        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.75rem; color: #cbd5e1; font-weight: 700; margin-bottom: 0.5rem; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; background: #26394e; border: 1px solid #3e5671; border-radius: 8px; color: white; font-size: 1rem; }

        /* CARRINHO */
        .cart-section { background: var(--brand-main); color: white; padding: 30px; border-radius: 20px; max-width: 700px; margin: 0 auto 50px auto; }
        .cart-items { margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .remove-btn { color: var(--danger); cursor: pointer; background: none; border: none; }

        .btn-action { background: var(--brand-accent); color: var(--brand-main); border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-finalize { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 20px; }

        #success-area { display: none; text-align: center; padding: 30px; background: rgba(16, 185, 129, 0.1); border-radius: 15px; border: 2px solid var(--success); }
        
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background: #25d366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1000; font-size: 30px; text-decoration: none; }

        @media (max-width: 600px) { .gallery { grid-template-columns: 1fr 1fr; gap: 10px; } .product-card img { height: 220px; } }
    </style>
</head>
<body>

<header>
    <img src="LOGO1.jpeg" alt="Logo" class="logo">
</header>

<div class="container">
    <h2>Coleção Exclusive</h2>
    <div class="gallery" id="vitrine"></div>

    <div class="cart-section">
        <div id="form-container">
            <h3>Seu Carrinho</h3>
            <div id="lista-carrinho" class="cart-items">
                <p style="text-align: center; opacity: 0.5; padding: 20px;">O carrinho está vazio.</p>
            </div>
            <div style="text-align: right; font-weight: 700; font-size: 1.2rem; margin-bottom: 20px;">
                Total: <span id="total-carrinho" style="color: var(--brand-accent);">R$ 0,00</span>
            </div>
            <div class="input-group">
                <label>Seu Nome</label>
                <input type="text" id="nome_cliente" placeholder="Nome Completo">
            </div>
            <button class="btn-finalize" onclick="enviarPedido()">FINALIZAR COMPRA</button>
        </div>

        <div id="success-area">
            <h2 style="color: var(--success);">Obrigada pela compra!</h2>
            <p>Entraremos em contato em breve.</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=bilhacamilla86@gmail.com" style="margin: 20px 0; border-radius: 10px;">
            <p style="font-size: 0.8rem;">Chave PIX: bilhacamilla86@gmail.com</p>
            <button onclick="copiarPix()" class="btn-action">COPIAR CHAVE PIX</button>
        </div>
    </div>
</div>

<div id="modal-selecao" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="fecharModal()">&times;</span>
        <h3 id="modal-titulo" style="color: var(--brand-accent); margin-bottom: 20px;">Produto</h3>
        
        <div class="input-group">
            <label>Tamanho</label>
            <select id="modal-tam"></select>
        </div>
        <div class="input-group">
            <label>Cor</label>
            <select id="modal-cor" disabled></select>
        </div>
        <p id="modal-preco" style="text-align: right; font-weight: 700; margin-bottom: 15px;"></p>
        
        <button class="btn-action" id="btn-add-modal" onclick="confirmarAdicao()">ADICIONAR AO CARRINHO</button>
    </div>
</div>

<a href="https://wa.me/5513996526566" class="whatsapp-float" target="_blank">🟢</a>

<script>
const SHEET_ID = '10PHxjW6F-roUMump4IkhLF4UG0kB_yvX'; 
const SHEET_NAME = 'cbfitwear'; 
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

let dados = [];
let carrinho = [];
let produtoSelecionadoAtual = "";

const fotosVitrine = [
    {n: 'CONJUNTO MARROM', f: 'foto1.jpeg'}, {n: 'CONJUNTO VERDE OLIVA', f: 'foto2.jpeg'},
    {n: 'CONJUNTO AZUL MARINHO', f: 'foto3.jpeg'}, {n: 'CONJUNTO PINK', f: 'foto5.jpeg'},
    {n: 'CONJUNTO VINHO', f: 'foto6.jpeg'}, {n: 'CONJUNTO VERDE CLARO', f: 'foto7.jpeg'},
    {n: 'CONJUNTO ROSA NEON', f: 'foto8.jpeg'}, {n: 'MACACÃO MARROM', f: 'foto9.jpeg'},
    {n: 'ROUPAS CBFITEAR', f: 'foto10.png'}
];

async function carregarDados() {
    try {
        const response = await fetch(URL);
        const text = await response.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        dados = json.table.rows.map(row => ({
            p: row.c[0]?.v || '', t: row.c[1]?.v || '', 
            c: row.c[2]?.v || '', v: row.c[3]?.v || 0, e: row.c[4]?.v || 0
        }));
        renderVitrine();
    } catch (e) { console.error("Erro dados:", e); }
}

function renderVitrine() {
    const vitrine = document.getElementById('vitrine');
    vitrine.innerHTML = fotosVitrine.map(item => {
        const estoque = dados.filter(d => d.p === item.n).reduce((acc, curr) => acc + curr.e, 0);
        return `
            <div class="product-card" onclick="abrirModal('${item.n}')">
                <img src="${item.f}" style="${estoque <= 0 ? 'filter: grayscale(1); opacity: 0.5;' : ''}">
                <div class="product-info">${item.n}<br>
                <small style="color:${estoque > 0 ? 'var(--success)' : 'var(--danger)'}">${estoque > 0 ? 'Disponível' : 'Esgotado'}</small>
                </div>
            </div>
        `;
    }).join('');
}

// LÓGICA DO MODAL (MELHORIA SOLICITADA)
function abrirModal(nome) {
    const estoqueTotal = dados.filter(d => d.p === nome).reduce((acc, curr) => acc + curr.e, 0);
    if(estoqueTotal <= 0) return alert("Produto sem estoque no momento!");

    produtoSelecionadoAtual = nome;
    document.getElementById('modal-titulo').textContent = nome;
    
    // Filtrar tamanhos com estoque > 0
    const tamanhos = [...new Set(dados.filter(d => d.p === nome && d.e > 0).map(d => d.t))].sort();
    const selTam = document.getElementById('modal-tam');
    selTam.innerHTML = '<option value="" selected disabled>Escolha o tamanho</option>';
    tamanhos.forEach(t => selTam.innerHTML += `<option value="${t}">${t}</option>`);
    
    document.getElementById('modal-cor').innerHTML = '';
    document.getElementById('modal-cor').disabled = true;
    document.getElementById('modal-preco').textContent = "";
    document.getElementById('modal-selecao').style.display = 'flex';
}

document.getElementById('modal-tam').addEventListener('change', (e) => {
    const cores = [...new Set(dados.filter(d => d.p === produtoSelecionadoAtual && d.t === e.target.value && d.e > 0).map(d => d.c))].sort();
    const selCor = document.getElementById('modal-cor');
    selCor.innerHTML = '<option value="" selected disabled>Escolha a cor</option>';
    cores.forEach(c => selCor.innerHTML += `<option value="${c}">${c}</option>`);
    selCor.disabled = false;
});

document.getElementById('modal-cor').addEventListener('change', (e) => {
    const item = dados.find(d => d.p === produtoSelecionadoAtual && d.t === document.getElementById('modal-tam').value && d.c === e.target.value);
    if(item) document.getElementById('modal-preco').textContent = `Preço: R$ ${item.v.toFixed(2).replace('.',',')}`;
});

function fecharModal() { document.getElementById('modal-selecao').style.display = 'none'; }

function confirmarAdicao() {
    const t = document.getElementById('modal-tam').value;
    const c = document.getElementById('modal-cor').value;
    if(!t || !c) return alert("Selecione tamanho e cor!");

    const item = dados.find(d => d.p === produtoSelecionadoAtual && d.t === t && d.c === c);
    carrinho.push({...item, id: Date.now()});
    atualizarCarrinho();
    fecharModal();
}

// CARRINHO E ENVIO
function atualizarCarrinho() {
    const lista = document.getElementById('lista-carrinho');
    if (carrinho.length === 0) {
        lista.innerHTML = '<p style="text-align: center; opacity: 0.5; padding: 20px;">O carrinho está vazio.</p>';
        document.getElementById('total-carrinho').textContent = "R$ 0,00";
        return;
    }
    lista.innerHTML = carrinho.map(i => `
        <div class="cart-item">
            <div><strong>${i.p}</strong><br><small>${i.t} | ${i.c}</small></div>
            <span>R$ ${i.v.toFixed(2).replace('.',',')} <button class="remove-btn" onclick="remover(${i.id})">✕</button></span>
        </div>
    `).join('');
    const total = carrinho.reduce((acc, i) => acc + i.v, 0);
    document.getElementById('total-carrinho').textContent = `R$ ${total.toFixed(2).replace('.',',')}`;
}

function remover(id) {
    carrinho = carrinho.filter(i => i.id !== id);
    atualizarCarrinho();
}

function enviarPedido() {
    const nome = document.getElementById('nome_cliente').value;
    if(!nome || carrinho.length === 0) return alert("Preencha seu nome e o carrinho!");

    const lista = carrinho.map(i => `- ${i.p} [${i.t}/${i.c}]: R$ ${i.v.toFixed(2)}`).join('\n');
    const corpo = `Olá Camilla, pedido de ${nome}:\n\n${lista}\n\nTOTAL: R$ ${carrinho.reduce((a,b)=>a+b.v,0).toFixed(2)}`;
    window.location.href = `mailto:camilla.bilha@hotmail.com?subject=Pedido-${nome}&body=${encodeURIComponent(corpo)}`;

    document.getElementById('form-container').style.display = 'none';
    document.getElementById('success-area').style.display = 'block';
}

function copiarPix() {
    navigator.clipboard.writeText("bilhacamilla86@gmail.com");
    alert("Chave copiada!");
}

window.onload = carregarDados;
</script>
</body>
</html>
