<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camilla Bilha | Fitwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-main: #1a2a3a;
            --brand-accent: #d4a373;
            --brand-light: #f4f4f9;
            --header-bg: rgba(243, 229, 232, 0.4); 
            --white: #ffffff;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --overlay: rgba(0,0,0,0.7);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        
        body { background-color: var(--brand-light); color: var(--brand-main); line-height: 1.6; position: relative; }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('logo3.png'); background-size: cover; background-position: center; opacity: 0.05; z-index: -1; pointer-events: none;
        }

        header { background-color: var(--header-bg); padding: 20px; text-align: center; position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(8px); border-bottom: 1px solid rgba(0,0,0,0.02); }
        .logo { max-width: 150px; border-radius: 12px; background: white; padding: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h2 { text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }

        .category-filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; }
        .filter-btn { background: white; border: 1px solid var(--brand-accent); color: var(--brand-main); padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .filter-btn.active { background: var(--brand-accent); color: var(--brand-main); }

/* Estilo para o selo de escassez */
.badge-escassez {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: var(--warning); /* Cor de alerta (laranja/ouro) */
    color: var(--brand-main);
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    z-index: 10;
}

        /* Estilo para a Tag de Promoção/Lançamento */
.badge-tag {
    position: absolute;
    top: 15px;
    left: 15px;
    background-color: var(--brand-main);
    color: var(--brand-accent);
    padding: 5px 15px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    z-index: 15;
    border: 1px solid var(--brand-accent);
}

.preco-original {
    text-decoration: line-through;
    color: #94a3b8;
    font-size: 0.85rem;
    margin-right: 8px;
}
.preco-venda {
    color: var(--brand-main);
    font-weight: 700;
}
.em-promo {
    color: var(--danger); /* Cor vermelha para destacar o desconto */
}
        
.product-card { position: relative; } /* Garante que o selo fique dentro do card */

        
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; }
        .product-card img { width: 100%; height: 400px; object-fit: cover; display: block; }
        .product-info { padding: 15px; text-align: center; font-weight: 600; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: var(--overlay); align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: var(--brand-main); color: white; padding: 30px; border-radius: 20px; width: 95%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 25px; cursor: pointer; color: var(--brand-accent); }

        .modal-gallery { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 20px; scroll-snap-type: x mandatory; }
        .modal-gallery img { width: 100%; max-height: 400px; object-fit: contain; background: rgba(255,255,255,0.05); border-radius: 12px; scroll-snap-align: center; flex-shrink: 0; }

        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.75rem; color: #cbd5e1; font-weight: 700; margin-bottom: 0.5rem; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; background: #26394e; border: 1px solid #3e5671; border-radius: 8px; color: white; }

        .cart-section { background: var(--brand-main); color: white; padding: 30px; border-radius: 20px; max-width: 700px; margin: 0 auto 50px auto; }
        .btn-action { background: var(--brand-accent); color: var(--brand-main); border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-finalize { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 20px; }

/* Estilos para a área de Pagamento */
.payment-box {
    background: rgba(255, 255, 255, 0.05);
    border: 1px dashed var(--brand-accent);
    padding: 15px;
    border-radius: 12px;
    margin: 20px 0;
    text-align: center;
}

.pix-key {
    display: block;
    font-family: monospace;
    background: #1e293b;
    padding: 10px;
    border-radius: 6px;
    margin: 10px 0;
    color: var(--brand-accent);
    font-size: 0.9rem;
    word-break: break-all;
}

.btn-copy {
    background: #009ee3; /* Azul Mercado Pago */
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.btn-copy:active { transform: scale(0.95); }

        
        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background: #25d366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1000; }

        @media (max-width: 600px) { .gallery { grid-template-columns: 1fr 1fr; gap: 10px; } .product-card img { height: 220px; } }
    </style>
</head>
<body>

<header><img src="LOGO1.jpeg" alt="Logo" class="logo"></header>

<div class="container">
    <h2>Coleção Exclusive</h2>
    <div class="category-filters">
        <button class="filter-btn active" onclick="filtrarCategoria('tudo', this)">Tudo</button>
        <button class="filter-btn" onclick="filtrarCategoria('conjunto', this)">Conjuntos</button>
        <button class="filter-btn" onclick="filtrarCategoria('macacao', this)">Macacões</button>
        <button class="filter-btn" onclick="filtrarCategoria('camiseta', this)">Camisetas</button>
    </div>
    <div class="gallery" id="vitrine"></div>

   <div class="cart-section">
    <h3>Seu Carrinho</h3>
    <div id="lista-carrinho"></div>
    <div style="text-align: right; margin: 20px 0;">Total: <span id="total-carrinho" style="color: var(--brand-accent);">R$ 0,00</span></div>
    
    <div class="payment-box">
        <label style="color: white; margin-bottom: 5px;">Pague via PIX (Mercado Pago)</label>
        <span class="pix-key" id="chave-pix">bilhacamilla86@gmail.com</span>
        <button class="btn-copy" onclick="copiarPix()">
            <span>📋</span> COPIAR CHAVE PIX
        </button>
    </div>

    <input type="text" id="nome_cliente" placeholder="Seu Nome Completo">
    <button class="btn-finalize" onclick="enviarPedido()">FINALIZAR E ENVIAR COMPROVANTE</button>
</div>

<div id="modal-selecao" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="fecharModal()">&times;</span>
        <div id="modal-imagens" class="modal-gallery"></div>
        <h3 id="modal-titulo" style="color: var(--brand-accent); margin-bottom: 20px;"></h3>
        <div class="input-group"><label>Tamanho</label><select id="modal-tam" onchange="atualizarCores()"></select></div>
        <div class="input-group"><label>Cor</label><select id="modal-cor"></select></div>
        <p id="modal-preco" style="text-align: right; font-weight: 700; font-size: 1.2rem;"></p>
        
        <p id="modal-alerta-estoque" style="color: var(--brand-accent); font-weight: 700; text-align: center; margin-top: 10px; font-size: 0.85rem; height: 1.2rem;"></p>
        
        <button class="btn-action" onclick="confirmarAdicao()">ADICIONAR AO CARRINHO</button>
    </div>
</div>

<script>
// ID extraído da sua planilha cbfitwear
// Configurações da Planilha
const SHEET_ID = '10PHxjW6F-roUMump4IkhLF4UG0kB_yvX'; 
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=cbfitwear`;

let dados = [];
let carrinho = [];
let categoriaAtual = 'tudo';
let produtoSelecionadoAtual = "";

// 1. Carregar Dados
async function carregarDados() {
    try {
        const r = await fetch(URL);
        const t = await r.text();
        const j = JSON.parse(t.substr(47).slice(0, -2));
        
        dados = j.table.rows.map(row => ({ 
            p: row.c[0]?.v || "", 
            t: row.c[1]?.v || "", 
            c: row.c[2]?.v || "", 
            v: row.c[3]?.v || 0,  
            e: row.c[4]?.v || 0,  
            f: row.c[5]?.v || "", 
            tag: row.c[6]?.v || "", 
            vPromo: row.c[7]?.v || null 
        }));
        
        renderVitrine();
    } catch (err) {
        console.error("Erro ao carregar planilha:", err);
    }
}

// 2. Filtros
function filtrarCategoria(cat, btn) {
    categoriaAtual = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderVitrine();
}

// 3. Renderizar Vitrine (Corrigida)
function renderVitrine() {
    const v = document.getElementById('vitrine');
    const produtosUnicos = [...new Set(dados.map(d => d.p))];
    
    const itensVitrine = produtosUnicos.map(nomeProd => {
        const variacoes = dados.filter(d => d.p === nomeProd);
        const itemPrincipal = variacoes[0];
        const fotosArray = itemPrincipal.f ? itemPrincipal.f.split(',').map(s => s.trim()) : ['https://via.placeholder.com/400x500?text=Sem+Foto'];
        const estoqueTotal = variacoes.reduce((acc, curr) => acc + (Number(curr.e) || 0), 0);
        
        return {
            n: nomeProd,
            f: fotosArray,
            tag: itemPrincipal.tag,
            vOriginal: itemPrincipal.v,
            vPromo: itemPrincipal.vPromo,
            estoqueTotal: estoqueTotal
        };
    });

    const itensFiltrados = categoriaAtual === 'tudo' ? itensVitrine : itensVitrine.filter(i => {
        const nomeNorm = i.n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        return nomeNorm.includes(categoriaAtual);
    });

    v.innerHTML = itensFiltrados.map(i => {
        const estaDisponivel = i.estoqueTotal > 0;
        const poucasUnidades = i.estoqueTotal > 0 && i.estoqueTotal <= 2;
        const temPromo = i.vPromo !== null && i.vPromo > 0;

        const precoHTML = temPromo 
            ? `<span class="preco-original">R$ ${i.vOriginal.toFixed(2).replace('.',',')}</span>
               <span class="preco-venda em-promo">R$ ${i.vPromo.toFixed(2).replace('.',',')}</span>`
            : `<span class="preco-venda">R$ ${i.vOriginal.toFixed(2).replace('.',',')}</span>`;

        return `
            <div class="product-card" onclick="${estaDisponivel ? `abrirModal('${i.n}')` : ''}">
                ${i.tag ? `<div class="badge-tag">${i.tag}</div>` : ''}
                ${poucasUnidades && !i.tag ? '<div class="badge-escassez">Últimas Unidades!</div>' : ''}
                <img src="${i.f[0]}" style="${estaDisponivel ? '' : 'filter: grayscale(1); opacity: 0.4;'}">
                <div class="product-info">
                    ${i.n}<br>
                    ${precoHTML}<br>
                    <small style="color: ${estaDisponivel ? (poucasUnidades ? 'var(--warning)' : 'var(--success)') : 'var(--danger)'};">
                        ${estaDisponivel ? (poucasUnidades ? 'CORRA! RESTAM POUCAS' : 'DISPONÍVEL') : 'INDISPONÍVEL'}
                    </small>
                </div>
            </div>
        `;
    }).join('');
}

// 4. Modal e Variantes
function abrirModal(nome) {
    produtoSelecionadoAtual = nome;
    const itemDados = dados.find(d => d.p === nome);
    const fotosArray = itemDados && itemDados.f ? itemDados.f.split(',').map(s => s.trim()) : ['https://via.placeholder.com/400x500?text=Sem+Foto'];

    const imagensDiv = document.getElementById('modal-imagens');
    imagensDiv.innerHTML = fotosArray.map(img => `<img src="${img}">`).join('');
    
    document.getElementById('modal-titulo').innerText = nome;
    const tamSelect = document.getElementById('modal-tam');
    const tamanhos = [...new Set(dados.filter(d => d.p === nome).map(d => d.t))];
    tamSelect.innerHTML = tamanhos.map(t => `<option value="${t}">${t}</option>`).join('');
    
    atualizarCores();
    document.getElementById('modal-selecao').style.display = 'flex';
}

function atualizarCores() {
    const nome = produtoSelecionadoAtual;
    const tam = document.getElementById('modal-tam').value;
    const corSelect = document.getElementById('modal-cor');
    const variacoes = dados.filter(d => d.p === nome && d.t === tam);
    
    corSelect.innerHTML = variacoes.map(v => `<option value="${v.c}">${v.c} (${v.e} un)</option>`).join('');
    
    if(variacoes[0]) {
        const item = variacoes[0];
        const temPromo = item.vPromo !== null && item.vPromo > 0;
        document.getElementById('modal-preco').innerHTML = temPromo
            ? `<span class="preco-original">R$ ${item.v.toFixed(2).replace('.',',')}</span> R$ ${item.vPromo.toFixed(2).replace('.',',')}`
            : `R$ ${item.v.toFixed(2).replace('.',',')}`;
    }
    verificarEscassezVariacao();
}

function verificarEscassezVariacao() {
    const nome = produtoSelecionadoAtual;
    const tam = document.getElementById('modal-tam').value;
    const cor = document.getElementById('modal-cor').value;
    const alerta = document.getElementById('modal-alerta-estoque');
    const item = dados.find(d => d.p === nome && d.t === tam && d.c === cor);
    alerta.innerText = (item && item.e > 0 && item.e <= 2) ? `🔥 Garanta a sua! Restam apenas ${item.e} unidades.` : "";
}

function fecharModal() { document.getElementById('modal-selecao').style.display = 'none'; }

// 5. Carrinho e Pedido
function confirmarAdicao() {
    const nome = produtoSelecionadoAtual;
    const tam = document.getElementById('modal-tam').value;
    const cor = document.getElementById('modal-cor').value;
    const item = dados.find(d => d.p === nome && d.t === tam && d.c === cor);
    if(item) {
        const precoFinal = (item.vPromo !== null && item.vPromo > 0) ? item.vPromo : item.v;
        carrinho.push({ ...item, vFinal: precoFinal, id: Date.now() });
        atualizarCarrinho();
        fecharModal();
    }
}

function atualizarCarrinho() {
    const lista = document.getElementById('lista-carrinho');
    lista.innerHTML = carrinho.map(i => `
        <div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #333;">
            <span>${i.p} (${i.t}/${i.c})</span>
            <span>R$ ${i.vFinal.toFixed(2).replace('.',',')}</span>
        </div>`).join('');
    const total = carrinho.reduce((a, b) => a + b.vFinal, 0);
    document.getElementById('total-carrinho').innerText = `R$ ${total.toFixed(2).replace('.',',')}`;
}

function copiarPix() {
    const chave = document.getElementById('chave-pix').innerText;
    navigator.clipboard.writeText(chave).then(() => {
        const btn = document.querySelector('.btn-copy');
        btn.innerHTML = "✅ COPIADO!";
        setTimeout(() => btn.innerHTML = "📋 COPIAR CHAVE PIX", 2000);
    });
}

function enviarPedido() {
    const nome = document.getElementById('nome_cliente').value;
    if(!nome || carrinho.length === 0) return alert("Preencha seu nome e adicione itens!");
    const total = document.getElementById('total-carrinho').innerText;
    const itens = carrinho.map(i => `- ${i.p} (${i.t}/${i.c})`).join('%0A');
    const msg = `Olá! Meu nome é ${nome}. Gostaria de confirmar o pedido:%0A%0A${itens}%0A%0A*Total: ${total}*`;
    window.open(`https://wa.me/5513996526566?text=${msg}`, '_blank');
}

window.onload = carregarDados;
</script>
</body>
</html>
