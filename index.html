<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camilla Bilha | Fitwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* CORES AJUSTADAS PARA COMBINAR COM O LOGO */
            --brand-main: #1a2a3a; /* Azul elegante */
            --brand-accent: #d4a373; /* Tom bronze/dourado */
            --brand-light: #f4f4f9;
            --white: #ffffff;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; transition: all 0.2s ease; }
        body { background-color: var(--brand-light); color: var(--brand-main); line-height: 1.6; }

        header {
            background-color: var(--brand-main);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .logo { 
            max-width: 150px; 
            height: auto; 
            border-radius: 15px; /* Bordas arredondadas para não ser quadrado */
            border: 2px solid var(--brand-accent);
            background: white;
            padding: 5px;
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        h2 { text-align: center; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; font-weight: 300; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 50px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 400px; object-fit: cover; display: block; }
        .product-info { padding: 15px; text-align: center; font-weight: 600; }

        /* SEÇÃO DO CARRINHO */
        .cart-section {
            background: var(--brand-main);
            color: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 700px;
            margin: 0 auto 50px auto;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .cart-section h3 { text-align: center; margin-bottom: 25px; color: var(--brand-accent); }
        
        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.75rem; color: #cbd5e1; font-weight: 700; margin-bottom: 0.5rem; text-transform: uppercase; }
        
        /* CORREÇÃO DO ERRO 1: CAMPOS VISÍVEIS INDEPENDENTE DO MOUSE */
        select, input {
            width: 100%; padding: 12px; 
            background: #26394e; /* Fundo sólido para visibilidade */
            border: 1px solid #3e5671; 
            border-radius: 8px; 
            color: white; 
            font-size: 1rem;
            display: block;
        }

        select:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-add { background: var(--brand-accent); color: var(--brand-main); border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-finalize { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 20px; }

        .cart-items { margin: 20px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .remove-btn { color: var(--danger); cursor: pointer; background: none; border: none; margin-left: 10px; }

        /* ÁREA DE PAGAMENTO PÓS-FINALIZAÇÃO */
        #payment-area { 
            display: none; 
            margin-top: 30px; 
            text-align: center; 
            padding: 20px; 
            background: rgba(255,255,255,0.05); 
            border-radius: 15px;
            border: 1px solid var(--brand-accent);
        }

        .whatsapp-float { position: fixed; bottom: 30px; right: 30px; background: #25d366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1000; text-decoration: none; font-size: 30px; }

        @media (max-width: 600px) {
            .gallery { grid-template-columns: 1fr 1fr; gap: 10px; }
            .product-card img { height: 220px; }
        }
    </style>
</head>
<body>

<header>
    <img src="LOGO1.jpeg" alt="Camilla Bilha Logo" class="logo">
</header>

<div class="container">
    <h2>Coleção Exclusive</h2>
    <div class="gallery" id="vitrine"></div>

    <div class="cart-section" id="fazer-pedido">
        <h3>Seu Pedido</h3>
        
        <div class="input-group">
            <label>1. Selecione o Produto</label>
            <select id="prod"></select>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="input-group">
                <label>2. Tamanho</label>
                <select id="tam" disabled></select>
            </div>
            <div class="input-group">
                <label>3. Cor</label>
                <select id="cor" disabled></select>
            </div>
        </div>
        
        <button class="btn-add" onclick="adicionarAoCarrinho()">+ Adicionar ao Carrinho</button>

        <div id="lista-carrinho" class="cart-items"></div>

        <div style="text-align: right; font-weight: 700; font-size: 1.2rem;">
            Total: <span id="total-carrinho" style="color: var(--brand-accent);">R$ 0,00</span>
        </div>

        <div class="input-group" style="margin-top: 20px;">
            <label>Seu Nome</label>
            <input type="text" id="nome_cliente" placeholder="Digite seu nome completo">
        </div>

        <button class="btn-finalize" onclick="enviarPedido()">FINALIZAR E ENVIAR PEDIDO</button>

        <div id="payment-area">
            <p style="color: var(--brand-accent); font-weight: 700; margin-bottom: 15px;">PEDIDO ENVIADO! PAGAMENTO PIX:</p>
            <div style="background: white; padding: 10px; display: inline-block; border-radius: 10px; margin-bottom: 15px;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=bilhacamilla86@gmail.com" alt="QR Code">
            </div>
            <input type="text" id="pix-chave" value="bilhacamilla86@gmail.com" readonly style="text-align: center; margin-bottom: 10px; background: #000;">
            <button onclick="copiarPix()" id="btn-pix" style="background: var(--brand-accent); color: #000; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: 700;">
                COPIAR CHAVE PIX
            </button>
        </div>
    </div>
</div>

<a href="https://wa.me/5513996526566" class="whatsapp-float" target="_blank">🟢</a>

<script>
const SHEET_ID = '10PHxjW6F-roUMump4IkhLF4UG0kB_yvX'; 
const SHEET_NAME = 'cbfitwear'; 
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

let dados = [];
let carrinho = [];

const fotosVitrine = [
    {n: 'CONJUNTO MARROM', f: 'foto1.jpeg'}, {n: 'CONJUNTO VERDE OLIVA', f: 'foto2.jpeg'},
    {n: 'CONJUNTO AZUL MARINHO', f: 'foto3.jpeg'}, {n: 'CONJUNTO PINK', f: 'foto5.jpeg'},
    {n: 'CONJUNTO VINHO', f: 'foto6.jpeg'}, {n: 'CONJUNTO VERDE CLARO', f: 'foto7.jpeg'},
    {n: 'CONJUNTO ROSA NEON', f: 'foto8.jpeg'}, {n: 'MACACÃO MARROM', f: 'foto9.jpeg'},
    {n: 'ROUPAS CBFITEAR', f: 'foto10.png'}
];

async function carregarDados() {
    try {
        const response = await fetch(URL);
        const text = await response.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        dados = json.table.rows.map(row => ({
            p: row.c[0]?.v || '', t: row.c[1]?.v || '', 
            c: row.c[2]?.v || '', v: row.c[3]?.v || 0, e: row.c[4]?.v || 0
        }));
        renderVitrine();
        initDropdown();
    } catch (e) { console.error("Erro:", e); }
}

function renderVitrine() {
    document.getElementById('vitrine').innerHTML = fotosVitrine.map(item => `
        <div class="product-card" onclick="selecionarDaVitrine('${item.n}')">
            <img src="${item.f}" alt="${item.n}">
            <div class="product-info">${item.n}</div>
        </div>
    `).join('');
}

function initDropdown() {
    const produtos = [...new Set(dados.map(i => i.p))].sort();
    const sel = document.getElementById('prod');
    sel.innerHTML = '<option value="" disabled selected>Escolha o produto...</option>';
    produtos.forEach(p => { sel.innerHTML += `<option value="${p}">${p}</option>`; });
}

function selecionarDaVitrine(nome) {
    const sel = document.getElementById('prod');
    sel.value = nome;
    sel.dispatchEvent(new Event('change'));
    document.getElementById('fazer-pedido').scrollIntoView({ behavior: 'smooth' });
}

document.getElementById('prod').addEventListener('change', (e) => {
    const filtrados = dados.filter(d => d.p === e.target.value);
    const tamanhos = [...new Set(filtrados.map(d => d.t))].sort();
    const selTam = document.getElementById('tam');
    selTam.innerHTML = '<option value="" disabled selected>Tamanho...</option>';
    tamanhos.forEach(t => { selTam.innerHTML += `<option value="${t}">${t}</option>`; });
    selTam.disabled = false;
});

document.getElementById('tam').addEventListener('change', (e) => {
    const filtrados = dados.filter(d => d.p === document.getElementById('prod').value && d.t === e.target.value);
    const cores = [...new Set(filtrados.map(d => d.c))].sort();
    const selCor = document.getElementById('cor');
    selCor.innerHTML = '<option value="" disabled selected>Cor...</option>';
    cores.forEach(c => { selCor.innerHTML += `<option value="${c}">${c}</option>`; });
    selCor.disabled = false;
});

function adicionarAoCarrinho() {
    const p = document.getElementById('prod').value;
    const t = document.getElementById('tam').value;
    const c = document.getElementById('cor').value;
    if(!p || !t || !c) return alert("Selecione todas as opções!");

    const item = dados.find(d => d.p === p && d.t === t && d.c === c);
    if(item) {
        carrinho.push({...item, id: Date.now()});
        atualizarCarrinho();
    }
}

function atualizarCarrinho() {
    const lista = document.getElementById('lista-carrinho');
    lista.innerHTML = carrinho.map(i => `
        <div class="cart-item">
            <span>${i.p} (${i.t}/${i.c})</span>
            <span>R$ ${i.v.toFixed(2)} <button class="remove-btn" onclick="remover(${i.id})">✕</button></span>
        </div>
    `).join('');
    const total = carrinho.reduce((acc, i) => acc + i.v, 0);
    document.getElementById('total-carrinho').textContent = `R$ ${total.toFixed(2).replace('.',',')}`;
}

function remover(id) {
    carrinho = carrinho.filter(i => i.id !== id);
    atualizarCarrinho();
}

function enviarPedido() {
    const nome = document.getElementById('nome_cliente').value;
    if(!nome || carrinho.length === 0) return alert("Preencha seu nome e adicione itens!");

    const total = carrinho.reduce((acc, i) => acc + i.v, 0);
    const lista = carrinho.map(i => `- ${i.p} [${i.t} | ${i.c}]: R$ ${i.v.toFixed(2)}`).join('\n');
    
    const corpo = `Olá Camilla, pedido de ${nome}:\n\n${lista}\n\nTOTAL: R$ ${total.toFixed(2)}\n\nChave PIX: bilhacamilla86@gmail.com`;
    const mailto = `mailto:camilla.bilha@hotmail.com?subject=Pedido Fitwear - ${nome}&body=${encodeURIComponent(corpo)}`;
    
    // Abre o e-mail
    window.location.href = mailto;

    // MOSTRA ÁREA DE PAGAMENTO (ERRO 3)
    document.getElementById('payment-area').style.display = 'block';
    document.getElementById('payment-area').scrollIntoView({ behavior: 'smooth' });
}

function copiarPix() {
    const input = document.getElementById("pix-chave");
    input.select();
    navigator.clipboard.writeText(input.value);
    document.getElementById("btn-pix").textContent = "CHAVE COPIADA!";
    setTimeout(() => { document.getElementById("btn-pix").textContent = "COPIAR CHAVE PIX"; }, 2000);
}

window.onload = carregarDados;
</script>
</body>
</html>
