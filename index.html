<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camilla Bilha | Fitwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-main: #111827; 
            --brand-secondary: #1e293b; 
            --brand-accent: #d4a373; 
            --bg-color: #faf9f6; 
            /* Rosa suave com transparência (RGBA: 243, 229, 232 com 30% de opacidade) */
            --header-bg: rgba(243, 229, 232, 0.3); 
            --white: #ffffff;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --overlay: rgba(17, 24, 39, 0.6); 
            
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-soft: 0 10px 25px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { 
            background-color: var(--bg-color); 
            color: var(--brand-main); 
            line-height: 1.6; 
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* AJUSTE DO TAMANHO DA FOTO DE FUNDO */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('foto1.png');
            background-repeat: no-repeat;
            background-size: 400px; /* Tamanho reduzido para não ficar desproporcional */
            background-position: center;
            opacity: 0.07; /* Levemente mais suave */
            z-index: -1; 
            pointer-events: none;
        }

        header { 
            background: var(--header-bg); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 1px solid rgba(0,0,0,0.02);
        }
        .logo { max-width: 140px; border-radius: 8px; }

        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        
        h2 { 
            text-align: center; 
            margin-bottom: 40px; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 300; 
            font-size: 1.4rem;
            color: var(--brand-secondary);
        }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-bottom: 60px; }
        .product-card { 
            background: var(--white); 
            border-radius: var(--radius-md); 
            overflow: hidden; 
            box-shadow: var(--shadow-soft); 
            cursor: pointer; 
            transition: transform 0.3s ease;
        }
        .product-card:hover { transform: translateY(-8px); }
        
        .img-wrapper { overflow: hidden; height: 380px; width: 100%; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .product-info { padding: 20px 15px; text-align: center; }

        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: var(--overlay); align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--white); padding: 35px; border-radius: var(--radius-lg);
            width: 90%; max-width: 420px; position: relative;
        }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #9ca3af; }

        .cart-section { 
            background: var(--brand-secondary); color: var(--white); padding: 40px; 
            border-radius: var(--radius-lg); max-width: 600px; margin: 0 auto 60px auto; 
        }

        .btn-action, .btn-finalize { 
            border: none; padding: 16px; border-radius: 8px; width: 100%; 
            font-weight: 600; cursor: pointer; text-transform: uppercase; 
        }
        .btn-action { background: var(--brand-accent); color: var(--white); }
        .btn-finalize { background: var(--white); color: var(--brand-secondary); margin-top: 25px; }

        #success-area { display: none; text-align: center; }

        .whatsapp-float { 
            position: fixed; bottom: 30px; right: 30px; background: #25d366; color: white;
            width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; z-index: 1000;
        }

        @media (max-width: 768px) { 
            .gallery { grid-template-columns: 1fr 1fr; gap: 15px; } 
            .img-wrapper { height: 260px; } 
            body::before { background-size: 250px; } /* Menor ainda no celular */
        }
    </style>
</head>
<body>

<header>
    <img src="LOGO1.jpeg" alt="Logo Camilla Bilha" class="logo">
</header>

<div class="container">
    <h2>Coleção Exclusive</h2>
    <div class="gallery" id="vitrine"></div>

    <div class="cart-section">
        <div id="form-container">
            <h3 style="text-align: center; margin-bottom: 20px;">Seu Carrinho</h3>
            <div id="lista-carrinho" style="margin-bottom: 20px;">
                <p style="text-align: center; opacity: 0.5;">O carrinho está vazio.</p>
            </div>
            <div style="text-align: right; font-weight: 600; margin-bottom: 20px;">
                Total: <span id="total-carrinho" style="color: var(--brand-accent);">R$ 0,00</span>
            </div>
            <input type="text" id="nome_cliente" placeholder="Seu nome completo" style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; outline: none;">
            <button class="btn-finalize" onclick="enviarPedido()">Finalizar Compra</button>
        </div>

        <div id="success-area">
            <h2 style="color: var(--success); margin-bottom: 15px;">Pedido Enviado! ✨</h2>
            <p style="margin-bottom: 20px;">Para agilizar, realize o pagamento PIX:</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=bilhacamilla86@gmail.com" style="margin-bottom: 20px; background: white; padding: 10px; border-radius: 10px;">
            <p style="font-weight: 600; margin-bottom: 20px;">bilhacamilla86@gmail.com</p>
            <button onclick="copiarPix()" class="btn-action">Copiar Chave PIX</button>
        </div>
    </div>
</div>

<div id="modal-selecao" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="fecharModal()">&times;</span>
        <h3 id="modal-titulo" style="margin-bottom: 20px; text-align: center;">Produto</h3>
        <div id="aviso-estoque" style="display: none; background: #fffbeb; color: var(--warning); padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; text-align: center; margin-bottom: 20px;">⚠️ Última peça disponível!</div>
        
        <div style="margin-bottom: 15px;">
            <label style="display:block; font-size: 0.7rem; font-weight: 700; margin-bottom: 5px;">TAMANHO</label>
            <select id="modal-tam" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;"></select>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display:block; font-size: 0.7rem; font-weight: 700; margin-bottom: 5px;">COR</label>
            <select id="modal-cor" disabled style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;"></select>
        </div>

        <p id="modal-preco" style="text-align: right; font-weight: 600; font-size: 1.2rem; margin-bottom: 20px;"></p>
        <button class="btn-action" onclick="confirmarAdicao()">Adicionar ao Carrinho</button>
    </div>
</div>

<a href="https://wa.me/5513996526566" class="whatsapp-float" target="_blank">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="white" style="margin-top: 15px; margin-left: 15px;"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.025 3.107l-.696 2.541 2.596-.681c.851.488 1.803.747 2.843.748h.002c3.181 0 5.767-2.586 5.768-5.766 0-3.18-2.585-5.764-5.767-5.764z"/></svg>
</a>

<script>
const SHEET_ID = '10PHxjW6F-roUMump4IkhLF4UG0kB_yvX'; 
const SHEET_NAME = 'cbfitwear'; 
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

let dados = [];
let carrinho = [];
let produtoSelecionadoAtual = "";

const fotosVitrine = [
    {n: 'CONJUNTO MARROM', f: 'foto1.jpeg'}, {n: 'CONJUNTO VERDE OLIVA', f: 'foto2.jpeg'},
    {n: 'Conjunto bicolor poliamida', f: 'foto3.jpeg'}, {n: 'CONJUNTO PINK', f: 'foto5.jpeg'},
    {n: 'CONJUNTO VINHO', f: 'foto6.jpeg'}, {n: 'CONJUNTO VERDE CLARO', f: 'foto7.jpeg'},
    {n: 'Top Nadador', f: 'foto8.jpeg'}, {n: 'Macacão sem manga', f: 'foto9.jpeg'},
    {n: 'Conjunto bicolor poliamida', f: 'foto10.png'}
];

async function carregarDados() {
    try {
        const response = await fetch(URL);
        const text = await response.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));
        dados = json.table.rows.map(row => ({
            p: row.c[0]?.v || '', t: row.c[1]?.v || '', 
            c: row.c[2]?.v || '', v: row.c[3]?.v || 0, e: row.c[4]?.v || 0
        }));
        renderVitrine();
    } catch (e) { console.error("Erro dados:", e); }
}

function renderVitrine() {
    const vitrine = document.getElementById('vitrine');
    vitrine.innerHTML = fotosVitrine.map(item => {
        const estoque = dados.filter(d => d.p === item.n).reduce((acc, curr) => acc + curr.e, 0);
        return `
            <div class="product-card" onclick="abrirModal('${item.n}')">
                <div class="img-wrapper">
                    <img src="${item.f}" style="${estoque <= 0 ? 'filter: grayscale(1); opacity: 0.6;' : ''}">
                </div>
                <div class="product-info">
                    <strong>${item.n}</strong><br>
                    <small style="color:${estoque > 0 ? 'var(--success)' : 'var(--danger)'}">${estoque > 0 ? (estoque === 1 ? 'Última Peça!' : 'Disponível') : 'Esgotado'}</small>
                </div>
            </div>
        `;
    }).join('');
}

function abrirModal(nome) {
    produtoSelecionadoAtual = nome;
    document.getElementById('modal-titulo').textContent = nome;
    const tamanhos = [...new Set(dados.filter(d => d.p === nome && d.e > 0).map(d => d.t))].sort();
    const selTam = document.getElementById('modal-tam');
    selTam.innerHTML = '<option value="" selected disabled>Escolha o tamanho</option>';
    tamanhos.forEach(t => selTam.innerHTML += `<option value="${t}">${t}</option>`);
    
    document.getElementById('aviso-estoque').style.display = 'none';
    document.getElementById('modal-cor').innerHTML = '<option value="" selected disabled>Selecione o tamanho</option>';
    document.getElementById('modal-cor').disabled = true;
    document.getElementById('modal-preco').textContent = "";
    document.getElementById('modal-selecao').style.display = 'flex';
}

document.getElementById('modal-tam').addEventListener('change', (e) => {
    const cores = [...new Set(dados.filter(d => d.p === produtoSelecionadoAtual && d.t === e.target.value && d.e > 0).map(d => d.c))].sort();
    const selCor = document.getElementById('modal-cor');
    selCor.innerHTML = '<option value="" selected disabled>Escolha a cor</option>';
    cores.forEach(c => selCor.innerHTML += `<option value="${c}">${c}</option>`);
    selCor.disabled = false;
});

document.getElementById('modal-cor').addEventListener('change', (e) => {
    const item = dados.find(d => d.p === produtoSelecionadoAtual && d.t === document.getElementById('modal-tam').value && d.c === e.target.value);
    if(item) {
        document.getElementById('modal-preco').textContent = `R$ ${item.v.toFixed(2).replace('.',',')}`;
        document.getElementById('aviso-estoque').style.display = (item.e === 1) ? 'block' : 'none';
    }
});

function fecharModal() { document.getElementById('modal-selecao').style.display = 'none'; }

function confirmarAdicao() {
    const t = document.getElementById('modal-tam').value;
    const c = document.getElementById('modal-cor').value;
    if(!t || !c) return alert("Selecione tamanho e cor!");

    const item = dados.find(d => d.p === produtoSelecionadoAtual && d.t === t && d.c === c);
    if (item.e === 1 && carrinho.some(i => i.p === item.p && i.t === item.t && i.c === item.c)) {
        return alert("Última peça já está no carrinho!");
    }

    carrinho.push({...item, id: Date.now()});
    atualizarCarrinho();
    fecharModal();
}

function atualizarCarrinho() {
    const lista = document.getElementById('lista-carrinho');
    if (carrinho.length === 0) {
        lista.innerHTML = '<p style="text-align: center; opacity: 0.5;">O carrinho está vazio.</p>';
        document.getElementById('total-carrinho').textContent = "R$ 0,00";
        return;
    }
    lista.innerHTML = carrinho.map(i => `
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px;">
            <div><strong>${i.p}</strong><br><small>${i.t} | ${i.c}</small></div>
            <div>R$ ${i.v.toFixed(2).replace('.',',')} <button onclick="remover(${i.id})" style="background:none; border:none; color:white; cursor:pointer; margin-left:10px;">✕</button></div>
        </div>
    `).join('');
    const total = carrinho.reduce((acc, i) => acc + i.v, 0);
    document.getElementById('total-carrinho').textContent = `R$ ${total.toFixed(2).replace('.',',')}`;
}

function remover(id) {
    carrinho = carrinho.filter(i => i.id !== id);
    atualizarCarrinho();
}

function enviarPedido() {
    const nome = document.getElementById('nome_cliente').value;
    if(!nome || carrinho.length === 0) return alert("Preencha o nome e adicione itens!");
    const lista = carrinho.map(i => `- ${i.p} [${i.t}/${i.c}]: R$ ${i.v.toFixed(2)}`).join('\n');
    const corpo = `Olá Camilla, pedido de ${nome}:\n\n${lista}\n\nTOTAL: R$ ${carrinho.reduce((a,b)=>a+b.v,0).toFixed(2)}`;
    window.location.href = `mailto:camilla.bilha@hotmail.com?subject=Pedido - ${nome}&body=${encodeURIComponent(corpo)}`;
    document.getElementById('form-container').style.display = 'none';
    document.getElementById('success-area').style.display = 'block';
}

function copiarPix() {
    navigator.clipboard.writeText("bilhacamilla86@gmail.com");
    alert("Chave PIX copiada!");
}

window.onload = carregarDados;

window.onclick = function(event) {
    if (event.target === document.getElementById('modal-selecao')) fecharModal();
}
</script>
</body>
</html>
